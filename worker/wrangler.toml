name = "taiyabah-sender"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Secrets (never stored here — set with `wrangler secret put <NAME>`):
#   TRUSTEE_PASSWORD        shared password trustees sign in with on admin.html
#   SESSION_SECRET          random string used to sign/verify login tokens
#   ONESIGNAL_APP_ID        Taiyabah Masjid's OneSignal app id
#   ONESIGNAL_REST_API_KEY  OneSignal REST API key (server-side only)
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
ALLOWED_ORIGIN = "https://yameenbux.github.io"

# Secrets are NOT set here. Add them with:
#   npx wrangler secret put ONESIGNAL_APP_ID
#   npx wrangler secret put ONESIGNAL_REST_API_KEY
#   npx wrangler secret put ADMIN_PASSWORD_HASH
#   npx wrangler secret put SESSION_SECRET

[triggers]
crons = ["* * * * *"]

# Created with: npx wrangler kv namespace create SENT_KV
# Paste the id it prints below.
[[kv_namespaces]]
binding = "SENT_KV"
id = "376be21472e240acaf04ab1dbd217947"
