name = "taiyabah-sender"
main = "worker.js"
compatibility_date = "2026-01-01"

# An upload once left two versions of this file concatenated, so `main` and
# `compatibility_date` were each defined twice. Wrangler rejects that outright
# ("trying to redefine an already defined table or value"), so every deploy
# failed and the live Worker silently stayed on an older build while the app
# moved on. Keep one definition of each.
#
# worker.js is the entry point, not src/index.js: it is the one that carries
# /api/set-my-tags, /api/health (which the deploy workflow checks) and the
# jamāʿah reminder cron.

[vars]
ALLOWED_ORIGIN = "https://yameenbux.github.io"

# Secrets are NOT set here. Add them with:
#   npx wrangler secret put ONESIGNAL_APP_ID
#   npx wrangler secret put ONESIGNAL_REST_API_KEY
#   npx wrangler secret put ADMIN_PASSWORD_HASH
#   npx wrangler secret put SESSION_SECRET

[triggers]
crons = ["* * * * *"]

# Created with: npx wrangler kv namespace create SENT_KV
# Paste the id it prints below.
[[kv_namespaces]]
binding = "SENT_KV"
id = "376be21472e240acaf04ab1dbd217947"
