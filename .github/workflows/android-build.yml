name: Android app bundle

# Builds the Play Store app from the PWA.
#
# WHY THIS RUNS HERE AND NOT ON A LAPTOP. The app is a Trusted Web Activity:
# a thin Android shell that opens taiyabahapp.ysbdesigns.uk full screen, with
# no browser bar, because the site proves the app is allowed to do that
# (see .well-known/assetlinks.json). Building one needs the Android SDK, a
# JDK and Bubblewrap. A GitHub runner has all three and a clean network, so
# nobody has to install Android tooling to cut a release.
#
# WHAT COMES OUT. A signed .aab, attached to the run as an artifact. Download
# it and upload it to the Play Console. Nothing is published automatically —
# a masjid's app should not go live because somebody merged a typo fix.
#
# THE SIGNING KEY IS NOT IN THIS REPOSITORY and must never be. It lives in
# two repository secrets. Losing it means the app can never be updated again,
# only replaced under a new name, so keep a copy somewhere safe offline:
#
#   ANDROID_KEYSTORE_BASE64   base64 of the .keystore file
#   ANDROID_KEYSTORE_PASSWORD the password protecting it
#
# To make one, on any machine with a JDK, then base64 it:
#
#   keytool -genkeypair -v -keystore android.keystore -alias taiyabah \
#           -keyalg RSA -keysize 2048 -validity 10000
#   base64 -w0 android.keystore > android.keystore.b64
#
# See store/ANDROID-RELEASE.md for the whole path to the Play Console.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version people see, e.g. 1.0.1'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Play version code — a whole number, HIGHER than the last upload'
        required: true
        default: '1'

jobs:
  bundle:
    runs-on: ubuntu-latest
    name: Build the app bundle
    steps:
      - uses: actions/checkout@v4

      # The site has to be reachable and serving the manifest, because
      # Bubblewrap reads it rather than trusting anything in this repository.
      - name: Check the site is live
        run: |
          set -e
          url=https://taiyabahapp.ysbdesigns.uk/manifest.webmanifest
          code=$(curl -sS -o manifest.live.json -w '%{http_code}' "$url")
          echo "$url -> $code"
          test "$code" = "200" || { echo "::error::the manifest is not being served"; exit 1; }
          python3 -c "import json;d=json.load(open('manifest.live.json'));print('live name:',d['name'])"

      # If this file still has the placeholder, the app installs and then
      # shows a browser bar, which is the single most common way a TWA ships
      # broken. It is only fillable AFTER the first upload, so this warns
      # rather than failing.
      - name: Warn if asset links are not filled in
        run: |
          if grep -q REPLACE_WITH .well-known/assetlinks.json; then
            echo "::warning::assetlinks.json still has the placeholder fingerprint."
            echo "::warning::Expected before the FIRST upload. Fill it from Play Console"
            echo "::warning::(Setup -> App integrity -> App signing key certificate) and"
            echo "::warning::merge that to main BEFORE promoting the release to production."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages` defaults to "tools platform-tools", and `tools` was retired
      # from Google's repository — sdkmanager exits 1 on "Failed to find package
      # 'tools'" and the whole job dies seven seconds in. Nothing here needs it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Bubblewrap would install these itself, but it looks for sdkmanager at
      # $ANDROID_HOME/tools/bin or $ANDROID_HOME/bin, and on a runner it lives
      # under cmdline-tools/<version>/bin — so that path throws instead. Putting
      # the packages in first means checkBuildTools() passes and it never tries.
      # Versions come from Bubblewrap 1.25.0: BUILD_TOOLS_VERSION in
      # AndroidSdkTools, and compileSdkVersion in its Gradle template.
      - name: Install the SDK pieces Bubblewrap expects
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0"
          ls "$ANDROID_SDK_ROOT/build-tools"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Point Bubblewrap at the runner's own tools
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See the header of this workflow."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android.keystore
          echo "keystore restored, $(stat -c%s android.keystore) bytes"

      - name: Set the version for this build
        run: |
          python3 - <<'PY'
          import json, os
          m = json.load(open('twa-manifest.json'))
          m['appVersionName'] = os.environ['VNAME']
          m['appVersion']     = os.environ['VNAME']
          m['appVersionCode'] = int(os.environ['VCODE'])
          json.dump(m, open('twa-manifest.json','w'), indent=2)
          print('building', m['appVersionName'], 'code', m['appVersionCode'])
          PY
        env:
          VNAME: ${{ inputs.versionName }}
          VCODE: ${{ inputs.versionCode }}

      # Regenerates the Android project from twa-manifest.json. It has to run,
      # and it has to run AFTER the version edit above: `build` on its own
      # expects a project that is already there, and if it notices the manifest
      # has changed since the project was generated it stops and ASKS whether
      # to update it — which on a runner means hanging until the job times out.
      - name: Generate the Android project
        run: bubblewrap update --skipVersionUpgrade

      # Bubblewrap takes these from the environment, not from flags. Both must
      # be set or it falls back to prompting, which hangs the run. keytool
      # offers to reuse the store password for the key, so one secret fills
      # both; if they were ever made different, this needs a second secret.
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation
          ls -la ./*.aab ./*.apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: taiyabah-${{ inputs.versionName }}
          path: |
            *.aab
            *.apk
          if-no-files-found: error
          retention-days: 30
