name: Native app (Android)

# Builds the React Native rebuild in native/ into an installable APK.
#
# RELEASE, NOT DEBUG — and this is the whole point. A DEBUG build does not
# contain the JavaScript. It expects to reach a Metro dev server on a laptop
# over the network, and with no server to find it sits on the splash screen
# forever. That is exactly what the first build did on a real phone.
# `assembleRelease` bundles the JavaScript into the APK, so it runs on its own.
#
# IT IS NOT FOR PLAY, and cannot become so by accident. Two things see to
# that. It signs with the DEBUG keystore, which Play refuses; and it builds the
# .dev variant (TAIYABAH_VARIANT below, see native/app.config.js), so the
# package id is com.taiyabahmasjid.app.dev rather than the one the listing owns.
# The release that goes to Play is a separate workflow: native-release.yml.
#
# WHAT COMES OUT. app-release.apk, attached to the run. Download it, allow
# installs from the browser, open it. It sits alongside the real app rather
# than replacing it — different package id AND a different signing key, so
# Android treats them as two apps, which is what you want while comparing
# them. The name on the home screen says "(test)".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native-build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    # Everything this job builds is the sideload variant. app.config.js reads
    # this and appends .dev to the package id.
    env:
      TAIYABAH_VARIANT: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install
        working-directory: native
        run: npm ci

      # Eight minutes of Gradle is a long time to find out a screen has a typo
      # in it. Every source file goes through the project's own Babel config
      # first, which costs seconds and fails loudly.
      - name: Check every screen parses
        working-directory: native
        run: node scripts/parse-check.mjs

      # Not fatal — a key with no pack entry reads in English rather than
      # breaking — but it should be visible in the log rather than found on
      # somebody's phone after they have switched to Urdu.
      - name: Check every component exists
        working-directory: native
        run: node scripts/check-refs.mjs

      - name: Check every screen says what the website says
        working-directory: native
        run: node scripts/check-screens.mjs --strict

      - name: Check every link points where the website points
        working-directory: native
        run: node scripts/check-links.mjs

      - name: Check every coloured box the website draws
        working-directory: native
        run: node scripts/check-boxes.mjs --strict

      - name: Which strings are still English only
        working-directory: native
        run: node scripts/check-i18n.mjs | head -40


      # check-parity.mjs is deliberately NOT here: it drives a browser, and the
      # APK build is not the place to acquire one. It runs before a hand-over —
      # see native/README.md.

      # Expo generates the android/ project from app.json. It is not committed:
      # it is build output, and a stale copy in the repo is a whole class of
      # "works on my machine" that nobody needs.
      - name: Generate the Android project
        working-directory: native
        run: npx expo prebuild --platform android --no-install

      # react-native-onesignal 5.4.3 declares its event listeners as codegen
      # EventEmitter properties, and those exist ONLY under the New
      # Architecture. Build it with the old one and the module loads, the
      # listener setup calls a property that is not there, and the app dies on
      # launch with "undefined is not a function" — a blank screen, no clue.
      # app.json asks for it; this proves prebuild actually wrote it.
      - name: Check the New Architecture is really on
        working-directory: native/android
        run: |
          grep -n "newArchEnabled" gradle.properties || true
          if ! grep -q "^newArchEnabled=true" gradle.properties; then
            echo "::error::newArchEnabled is not true in android/gradle.properties."
            echo "::error::OneSignal needs it; without it the app crashes on launch."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's real complaint is usually thirty lines above the one line a
      # check annotation shows, and the raw log is not reachable through the
      # API. So the tail goes into the job summary, which is.
      - name: Build the APK
        working-directory: native/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      # A job summary is not reachable through the REST API, but an
      # ::error:: workflow command becomes a check ANNOTATION, and annotations
      # are. So the failure is echoed back as annotations, which means a
      # broken build can be diagnosed without opening a browser.
      - name: What Gradle actually said
        if: failure()
        run: |
          echo '## Gradle failed' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/FAILURE: Build failed/,$p' /tmp/gradle.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "what went wrong" -A6 /tmp/gradle.log | head -30 \
            | while IFS= read -r line; do echo "::error::${line}"; done || true
          grep -iE "^e: |error: |Caused by:|Could not |OutOfMemory|SDK location" /tmp/gradle.log | head -12 \
            | while IFS= read -r line; do echo "::error::${line}"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: taiyabah-native-${{ github.run_number }}
          path: native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
