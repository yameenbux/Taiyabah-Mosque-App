name: Native app (Android)

# Builds the React Native rebuild in native/ into an installable APK.
#
# RELEASE, NOT DEBUG — and this is the whole point. A DEBUG build does not
# contain the JavaScript. It expects to reach a Metro dev server on a laptop
# over the network, and with no server to find it sits on the splash screen
# forever. That is exactly what the first build did on a real phone.
# `assembleRelease` bundles the JavaScript into the APK, so it runs on its own.
#
# It is still not for Play. Expo's generated project signs release with the
# DEBUG keystore (see android/app/build.gradle), which makes an APK that
# installs by hand but that Play would reject — which is the right shape while
# the listing still belongs to the web app. When the native app is ready, this
# grows a real signing step using the same two secrets the web app's build
# already uses. Until then it cannot touch the listing even by accident.
#
# WHAT COMES OUT. app-debug.apk, attached to the run. Download it, allow
# installs from the browser, open it. It sits alongside the Play version
# rather than replacing it — different signing key, so Android treats them as
# two apps, which is exactly what you want while comparing them.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native-build.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install
        working-directory: native
        run: npm ci

      # Expo generates the android/ project from app.json. It is not committed:
      # it is build output, and a stale copy in the repo is a whole class of
      # "works on my machine" that nobody needs.
      - name: Generate the Android project
        working-directory: native
        run: npx expo prebuild --platform android --no-install

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's real complaint is usually thirty lines above the one line a
      # check annotation shows, and the raw log is not reachable through the
      # API. So the tail goes into the job summary, which is.
      - name: Build the APK
        working-directory: native/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      # A job summary is not reachable through the REST API, but an
      # ::error:: workflow command becomes a check ANNOTATION, and annotations
      # are. So the failure is echoed back as annotations, which means a
      # broken build can be diagnosed without opening a browser.
      - name: What Gradle actually said
        if: failure()
        run: |
          echo '## Gradle failed' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/FAILURE: Build failed/,$p' /tmp/gradle.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "what went wrong" -A6 /tmp/gradle.log | head -30 \
            | while IFS= read -r line; do echo "::error::${line}"; done || true
          grep -iE "^e: |error: |Caused by:|Could not |OutOfMemory|SDK location" /tmp/gradle.log | head -12 \
            | while IFS= read -r line; do echo "::error::${line}"; done || true

      - uses: actions/upload-artifact@v4
        with:
          name: taiyabah-native-${{ github.run_number }}
          path: native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
